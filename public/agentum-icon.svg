<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Agentum app icon — rounded-square tile + four teardrops + white-hot core -->
  <defs>
    <radialGradient id="rg" gradientUnits="userSpaceOnUse" cx="250" cy="250" r="195">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.10" stop-color="#E6FFD8"/>
      <stop offset="0.38" stop-color="#A8FF60"/>
      <stop offset="1" stop-color="#14F195"/>
    </radialGradient>
    <radialGradient id="tile" gradientUnits="userSpaceOnUse" cx="250" cy="200" r="320">
      <stop offset="0" stop-color="#0B1410"/>
      <stop offset="1" stop-color="#050A07"/>
    </radialGradient>
    <radialGradient id="core" gradientUnits="userSpaceOnUse" cx="250" cy="250" r="80">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#D6FFC9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#14F195" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="460" height="460" rx="112" fill="url(#tile)" stroke="#16241c" stroke-width="2"/>
  <g filter="url(#glow)" fill="url(#rg)">
    <path d="M250 250 C213 205 172 190 172 135 A78 78 0 1 1 328 135 C328 190 287 205 250 250 Z"/>
    <path d="M250 250 C213 205 172 190 172 135 A78 78 0 1 1 328 135 C328 190 287 205 250 250 Z" transform="rotate(90 250 250)"/>
    <path d="M250 250 C213 205 172 190 172 135 A78 78 0 1 1 328 135 C328 190 287 205 250 250 Z" transform="rotate(180 250 250)"/>
    <path d="M250 250 C213 205 172 190 172 135 A78 78 0 1 1 328 135 C328 190 287 205 250 250 Z" transform="rotate(270 250 250)"/>
  </g>
  <circle cx="250" cy="250" r="80" fill="url(#core)"/>
</svg>
